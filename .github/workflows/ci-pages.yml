name: Validate and deploy Genesis

on:
  push:
    branches: [main, signal-game]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run simulation tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install browser verifier
        if: github.ref == 'refs/heads/signal-game' || github.event_name == 'pull_request'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify SIGNAL in mobile Chromium
        if: github.ref == 'refs/heads/signal-game' || github.event_name == 'pull_request'
        run: |
          mkdir -p artifacts
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/signal-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/signal-browser-check.mjs
      - name: Upload SIGNAL browser evidence
        if: always() && (github.ref == 'refs/heads/signal-game' || github.event_name == 'pull_request')
        uses: actions/upload-artifact@v4
        with:
          name: signal-browser-check
          path: artifacts
          if-no-files-found: error
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/signal-game'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/signal-game'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/signal-game'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
